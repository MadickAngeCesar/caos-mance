<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="100%" height="100%">
  <defs>
    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="30%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <!-- Border Gradient -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" flood-color="#0F172A" />
    </filter>
  </defs>

  <!-- Outer Shield Shape (Blue/Indigo glow) -->
  <path d="M 250 15 C 380 15 475 40 475 140 C 475 340 370 480 250 565 C 130 480 25 340 25 140 C 25 40 120 15 250 15 Z" 
        fill="url(#shieldGrad)" filter="url(#shieldShadow)" />

  <!-- Cyan Inner Border Outline -->
  <path d="M 250 25 C 365 25 460 50 460 145 C 460 330 360 465 250 545 C 140 465 40 330 40 145 C 40 50 135 25 250 25 Z" 
        fill="#0891B2" />

  <!-- Dark Midnight Blue Secondary Border -->
  <path d="M 250 40 C 350 40 440 60 440 150 C 440 320 345 445 250 520 C 155 445 60 320 60 150 C 60 60 150 40 250 40 Z" 
        fill="#0F172A" />

  <!-- Beige / Warm Cream Shield Background Canvas -->
  <path d="M 250 55 C 340 55 425 75 425 155 C 425 310 335 430 250 500 C 165 430 75 310 75 155 C 75 75 160 55 250 55 Z" 
        fill="#EDE4CE" />

  <!-- Inner Subtle Border -->
  <path d="M 250 63 C 335 63 415 80 415 158 C 415 305 330 422 250 490 C 170 422 85 305 85 158 C 85 80 165 63 250 63 Z" 
        fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.4" />

  <!-- Top Curved Text: MADICK ANGE CÉSAR -->
  <path id="textArc" d="M 120 135 Q 250 100 380 135" fill="none" />
  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="14" font-weight="700" fill="#1E293B" letter-spacing="4">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      MADICK ANGE CÉSAR
    </textPath>
  </text>

  <!-- Giant Emblem Acronym: MAC -->
  <text x="250" y="195" font-family="'Playfair Display', 'Times New Roman', serif" font-size="74" font-weight="900" fill="#3B82F6" text-anchor="middle" letter-spacing="2">
    MAC
  </text>

  <!-- Subtitle: TECH -->
  <text x="250" y="235" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#06B6D4" text-anchor="middle" letter-spacing="8">
    TECH
  </text>

  <!-- Laurel / Wheat Sprigs (Left) -->
  <g fill="#4338CA">
    <ellipse cx="112" cy="260" rx="4" ry="10" transform="rotate(-30 112 260)" />
    <ellipse cx="118" cy="278" rx="4" ry="10" transform="rotate(-20 118 278)" />
    <ellipse cx="120" cy="298" rx="4" ry="10" transform="rotate(-10 120 298)" />
    <ellipse cx="118" cy="318" rx="4" ry="10" transform="rotate(0 118 318)" />
    <ellipse cx="126" cy="270" rx="4" ry="9" transform="rotate(35 126 270)" />
    <ellipse cx="128" cy="290" rx="4" ry="9" transform="rotate(45 128 290)" />
    <ellipse cx="126" cy="310" rx="4" ry="9" transform="rotate(50 126 310)" />
  </g>

  <!-- Laurel / Wheat Sprigs (Right) -->
  <g fill="#4338CA">
    <ellipse cx="388" cy="260" rx="4" ry="10" transform="rotate(30 388 260)" />
    <ellipse cx="382" cy="278" rx="4" ry="10" transform="rotate(20 382 278)" />
    <ellipse cx="380" cy="298" rx="4" ry="10" transform="rotate(10 380 298)" />
    <ellipse cx="382" cy="318" rx="4" ry="10" transform="rotate(0 382 318)" />
    <ellipse cx="374" cy="270" rx="4" ry="9" transform="rotate(-35 374 270)" />
    <ellipse cx="372" cy="290" rx="4" ry="9" transform="rotate(-45 372 290)" />
    <ellipse cx="374" cy="310" rx="4" ry="9" transform="rotate(-50 374 310)" />
  </g>

  <!-- Divider Line with Dot (Top) -->
  <line x1="150" y1="250" x2="350" y2="250" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="250" cy="250" r="4" fill="#06B6D4" />
  <circle cx="150" cy="250" r="2.5" fill="#4338CA" />
  <circle cx="350" cy="250" r="2.5" fill="#4338CA" />

  <!-- Professional Title Text -->
  <text x="250" y="278" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="2">
    FULL-STACK DEVELOPER
  </text>
  <text x="250" y="296" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#0891B2" text-anchor="middle">
    &amp;
  </text>
  <text x="250" y="316" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="2">
    IT SPECIALIST
  </text>

  <!-- Divider Line with Dot (Bottom) -->
  <line x1="150" y1="332" x2="350" y2="332" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="250" cy="332" r="4" fill="#06B6D4" />
  <circle cx="150" cy="332" r="2.5" fill="#4338CA" />
  <circle cx="350" cy="332" r="2.5" fill="#4338CA" />

  <!-- Laptop Icon & Terminal -->
  <g transform="translate(195, 345)">
    <!-- Screen Outer Frame -->
    <rect x="10" y="0" width="90" height="64" rx="7" fill="#1E1B4B" stroke="#4338CA" stroke-width="2" />
    <!-- Screen Inner Display -->
    <rect x="15" y="5" width="80" height="50" rx="3" fill="#0F172A" />
    
    <!-- Code Lines / Terminal Prompt -->
    <!-- >_ prompt in cyan -->
    <path d="M 22 17 L 29 22 L 22 27" fill="none" stroke="#06B6D4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="33" y1="22" x2="68" y2="22" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round" />
    <line x1="22" y1="33" x2="62" y2="33" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <circle cx="72" cy="33" r="3" fill="#06B6D4" />
    <line x1="22" y1="43" x2="52" y2="43" stroke="#818CF8" stroke-width="2" stroke-linecap="round" />
    
    <!-- Laptop Base -->
    <rect x="0" y="66" width="110" height="12" rx="4" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5" />
    <line x1="45" y1="67" x2="65" y2="67" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Tagline: BUILDING DIGITAL SOLUTIONS -->
  <text x="250" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" font-style="italic" fill="#334155" text-anchor="middle" letter-spacing="2">
    BUILDING DIGITAL SOLUTIONS
  </text>

  <!-- Bottom Accent Dots -->
  <circle cx="225" cy="460" r="3" fill="#6366F1" />
  <circle cx="250" cy="460" r="4.5" fill="#06B6D4" />
  <circle cx="275" cy="460" r="3" fill="#6366F1" />
</svg>
